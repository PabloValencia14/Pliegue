name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check column layout
        run: |
          mkdir -p app/build/layout-check
          javac --release 17 -d app/build/layout-check app/src/main/java/es/pablo/periodico/ArticleColumns.java app/src/test/java/es/pablo/periodico/ArticleColumnsCheck.java
          java -cp app/build/layout-check es.pablo.periodico.ArticleColumnsCheck
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pliegue-ci-debug
          path: app/build/outputs/apk/debug/app-debug.apk
